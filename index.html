<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAVEROCK · 디자인 툴</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.min.css">
<link rel="stylesheet" href="ui.css">
<style>
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--wr-bg);color:var(--wr-ink);font-family:var(--wr-font)}
  .wrap{max-width:1040px;margin:0 auto;padding:40px 16px 64px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 24px}
  h1{margin:0;font-size:26px;letter-spacing:-.5px}
  .tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none}
  .tool{display:flex;flex-direction:column;height:100%;border:1px solid var(--wr-line);border-radius:12px;background:var(--wr-surface);overflow:hidden}
  .head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 12px 14px 16px;border-bottom:1px solid var(--wr-line)}
  .head h2{margin:0;font-size:17px;letter-spacing:-.3px}
  .icon{display:inline-grid;place-items:center;width:34px;height:34px;flex:none;border:0;border-radius:var(--wr-radius);background:transparent;color:var(--wr-sub);cursor:pointer}
  .icon:hover{background:var(--wr-soft);color:var(--wr-ink)}
  .thumb{display:block;aspect-ratio:16/10;background:var(--wr-soft);border-bottom:1px solid var(--wr-line)}
  .thumb img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
  .body{display:flex;flex-direction:column;gap:12px;flex:1;padding:16px}
  .body p{margin:0;color:var(--wr-sub);font-size:14px;line-height:1.6}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{padding:4px 10px;border:1px solid var(--wr-line);border-radius:999px;background:var(--wr-soft);color:var(--wr-ink);font:600 12px/1.4 var(--wr-font)}
  button.tag{cursor:pointer;background:var(--wr-surface);color:var(--wr-sub)}
  button.tag:hover{background:var(--wr-soft)}
  button.tag[aria-pressed="true"]{background:var(--wr-accent);border-color:var(--wr-accent);color:var(--wr-accent-ink)}
  button.tag:focus-visible{outline:2px solid var(--wr-accent);outline-offset:2px}
  .edit{display:grid;gap:8px}
  .edit-actions{display:flex;gap:8px}
  .note{color:var(--wr-ink)!important;background:var(--wr-soft);padding:10px 12px;border-radius:var(--wr-radius)}
  .open{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:var(--wr-radius);background:var(--wr-accent);color:var(--wr-accent-ink);font-weight:700;font-size:14px;text-decoration:none}
  .open:hover{opacity:.88}
  .open:focus-visible,.thumb:focus-visible,.icon:focus-visible,.btn:focus-visible{outline:2px solid var(--wr-accent);outline-offset:2px}
  #load-error{color:var(--wr-danger);font-size:14px}

  input,textarea{font:inherit;font-size:14px;color:var(--wr-ink);padding:10px 12px;border:1px solid var(--wr-line);border-radius:var(--wr-radius);background:var(--wr-surface);min-width:0;width:100%}
  textarea{resize:vertical;line-height:1.6}
  .btn{font:inherit;font-size:13px;font-weight:700;padding:9px 14px;border:0;border-radius:var(--wr-radius);background:var(--wr-soft);color:var(--wr-ink);cursor:pointer;text-decoration:none;display:inline-block}
  .btn:hover{background:var(--wr-soft-hover)}
  .btn.primary{background:var(--wr-accent);color:var(--wr-accent-ink)}
  .btn.primary:hover{opacity:.88;background:var(--wr-accent)}

  /* 새 툴 추가 도우미 */
  .add{width:min(600px,calc(100% - 32px));max-height:calc(100% - 32px);padding:0;border:1px solid var(--wr-line);border-radius:12px;background:var(--wr-bg);color:var(--wr-ink)}
  .add::backdrop{background:rgba(0,0,0,.35)}
  .add-head{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 14px 20px;border-bottom:1px solid var(--wr-line);background:var(--wr-surface)}
  .add-head h2{margin:0;font-size:17px}
  .add-body{display:grid;gap:14px;padding:20px}
  .add label,.add .label{display:grid;gap:6px;font-size:13px;color:var(--wr-sub)}
  .add ol{margin:0;padding-left:20px;font-size:14px;line-height:1.8}
  .add pre{margin:0;padding:12px;border-radius:var(--wr-radius);background:var(--wr-surface);border:1px solid var(--wr-line);font-size:12px;white-space:pre-wrap;word-break:break-all}
  @media(max-width:600px){.wrap{padding:28px 16px 48px}.top{margin-bottom:18px}h1{font-size:22px}.tools{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <h1>WAVEROCK 디자인 툴</h1>
    <button type="button" class="btn" id="add-open">＋ 새 툴 추가</button>
  </div>
  <ul class="tools" id="tools"></ul>
  <p id="load-error" hidden>목록을 불러오지 못했어요. 새로고침해 주세요.</p>
</main>

<dialog class="add" id="add">
  <div class="add-head">
    <h2>새 툴 추가</h2>
    <button type="button" class="icon" id="add-close" aria-label="닫기" title="닫기">✕</button>
  </div>
  <div class="add-body">
    <label>툴 이름<input id="f-name" placeholder="예: 이벤트 포스터"></label>
    <div class="label">담당자<div class="tags" id="f-tags"></div></div>
    <label>설명<textarea id="f-desc" rows="2" placeholder="한 줄로 무엇을 만드는 툴인지 적어 주세요."></textarea></label>
    <label>주소(URL)<input id="f-url" type="url" placeholder="https://igoodimin.github.io/..."></label>
    <label>썸네일 파일 이름<input id="f-thumb" placeholder="예: event-poster.jpg (가로 16:10 권장)"></label>
    <pre id="f-out"></pre>
    <div><button type="button" class="btn" id="f-copy">이 내용 복사</button></div>
    <ol>
      <li><a href="https://github.com/igoodimin/waverock-design-tools/upload/main/thumbs" target="_blank" rel="noopener">썸네일 올리기</a> — 위에 적은 파일 이름 그대로 올립니다.</li>
      <li><a href="https://github.com/igoodimin/waverock-design-tools/edit/main/tools.json" target="_blank" rel="noopener">tools.json 고치기</a> — 마지막 <code>}</code> 뒤에 쉼표(,)를 찍고 복사한 내용을 붙여 넣습니다.</li>
      <li>초록색 <b>Commit changes</b> 버튼을 누릅니다. 1~2분 뒤 이 페이지에 나타납니다.</li>
    </ol>
  </div>
</dialog>
<script>
  const EDIT_URL = 'https://github.com/igoodimin/waverock-design-tools/edit/main/tools.json';
  const PENCIL = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  const TAGS = ['세터', '매니저', '스태프', '디자이너'];
  const list = document.getElementById('tools');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const tagList = tags => (tags || []).map(x => `<span class="tag">${esc(x)}</span>`).join('');
  const tagPicker = (selected = []) => TAGS.map(x =>
    `<button type="button" class="tag" data-tag="${esc(x)}" aria-pressed="${selected.includes(x)}">${esc(x)}</button>`).join('');
  const pickedTags = box => [...box.querySelectorAll('[aria-pressed="true"]')].map(b => b.dataset.tag);
  document.addEventListener('click', e => {
    const b = e.target.closest('button[data-tag]');
    if (b) b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true');
  });
  let tools = [];

  fetch('tools.json', {cache: 'no-cache'})
    .then(r => r.json())
    .then(data => {
      tools = data;
      list.innerHTML = tools.map((t, i) => `
        <li class="tool" data-i="${i}">
          <div class="head">
            <h2>${esc(t.name)}</h2>
            <button type="button" class="icon" data-act="edit" aria-label="${esc(t.name)} 설명 수정" title="설명 수정">${PENCIL}</button>
          </div>
          <a class="thumb" href="${esc(t.url)}" tabindex="-1" aria-hidden="true">${t.thumbnail ? `<img src="${esc(t.thumbnail)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</a>
          <div class="body">
            <div class="tags shown"${t.tags?.length ? '' : ' hidden'}>${tagList(t.tags)}</div>
            <p class="desc">${esc(t.description)}</p>
            <a class="open" href="${esc(t.url)}">열기<span aria-hidden="true">→</span></a>
          </div>
        </li>`).join('');
    })
    .catch(() => { document.getElementById('load-error').hidden = false; });

  // 설명 수정: 고친 tools.json 전체를 복사하고 GitHub 수정 화면을 엽니다.
  list.addEventListener('click', async e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const card = btn.closest('.tool');
    const t = tools[card.dataset.i];
    const body = card.querySelector('.body');
    const act = btn.dataset.act;

    if (act === 'edit') {
      if (body.querySelector('.edit')) return;
      body.querySelector('.note')?.remove();
      const desc = body.querySelector('.desc');
      desc.hidden = true;
      body.querySelector('.shown').hidden = true;
      desc.insertAdjacentHTML('afterend', `
        <div class="edit">
          <div class="tags" role="group" aria-label="담당자">${tagPicker(t.tags)}</div>
          <textarea rows="3" aria-label="설명">${esc(t.description)}</textarea>
          <div class="edit-actions">
            <button type="button" class="btn primary" data-act="save">저장</button>
            <button type="button" class="btn" data-act="cancel">취소</button>
          </div>
        </div>`);
      const ta = body.querySelector('.edit textarea');
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
      return;
    }

    const edit = body.querySelector('.edit');
    const desc = body.querySelector('.desc');
    const shown = body.querySelector('.shown');
    if (act === 'cancel') {
      edit.remove();
      desc.hidden = false;
      shown.hidden = !t.tags?.length;
      return;
    }
    if (act === 'save') {
      t.description = edit.querySelector('textarea').value.trim();
      t.tags = pickedTags(edit);
      desc.textContent = t.description;
      shown.innerHTML = tagList(t.tags);
      shown.hidden = !t.tags.length;
      edit.remove();
      desc.hidden = false;
      const json = JSON.stringify(tools, null, 2) + '\n';
      let copied = true;
      try { await navigator.clipboard.writeText(json); } catch { copied = false; }
      window.open(EDIT_URL, '_blank', 'noopener');
      desc.insertAdjacentHTML('afterend', copied
        ? '<p class="note">새 내용을 복사했어요. 열린 GitHub 화면에서 ⌘A로 전체 선택 → ⌘V로 붙여 넣고 <b>Commit changes</b>를 누르세요.</p>'
        : '<div class="note" style="display:grid;gap:8px"><p>복사하지 못했어요. 아래 내용을 ⌘A, ⌘C로 복사해 GitHub 화면에 붙여 넣으세요.</p><textarea rows="6" readonly></textarea></div>');
      const fallback = body.querySelector('.note textarea');
      if (fallback) { fallback.value = json; fallback.select(); }
    }
  });

  const f = id => document.getElementById(id);
  const dialog = f('add');
  f('add-open').addEventListener('click', () => dialog.showModal());
  f('add-close').addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', e => { if (e.target === dialog) dialog.close(); });

  const out = f('f-out');
  f('f-tags').innerHTML = tagPicker();
  f('f-tags').addEventListener('click', () => setTimeout(render));
  function render() {
    const thumb = f('f-thumb').value.trim();
    out.textContent = JSON.stringify({
      name: f('f-name').value.trim(),
      tags: pickedTags(f('f-tags')),
      description: f('f-desc').value.trim(),
      url: f('f-url').value.trim(),
      thumbnail: thumb ? `thumbs/${thumb}` : ''
    }, null, 2);
  }
  ['f-name','f-desc','f-url','f-thumb'].forEach(id => f(id).addEventListener('input', render));
  render();
  f('f-copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(out.textContent); f('f-copy').textContent = '복사됨'; }
    catch { f('f-copy').textContent = '직접 선택해 복사해 주세요'; }
    setTimeout(() => f('f-copy').textContent = '이 내용 복사', 1500);
  });
</script>
</body>
</html>
